[project]
name = "dlvr"
version = "0.1.0"
description = "Course project DLVR Aarhus University 2026"
readme = "README.md"
authors = [
    { name = "Jonas E. Svane", email = "jonassvane9@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gdown>=6.4.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
unzip-data = "dlvr.utils:extract_deepcrack_data"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
